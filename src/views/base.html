<!DOCTYPE html>
<head>
    <title>PM2 WebUI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/jpg" href="/assets/images/app/favicon.png"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@tabler/core@1.0.0-beta2/dist/js/tabler.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@tabler/core@1.0.0-beta2/dist/css/tabler.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="/assets/css/prism.css" rel="stylesheet" />
    <link href="/assets/css/custom.css?v=6" rel="stylesheet" />
</head>
<body>
    <aside class="app-sidebar" id="appSidebar">
        <div class="sidebar-header">
            <a href="/apps" class="sidebar-logo">
                <div class="sidebar-logo-icon">
                    <img src="/assets/images/app/logo.png" alt="" width="36" height="36" class="sidebar-logo-icon-img">
                </div>
                <div class="sidebar-logo-text">PM2<span>WebUI</span></div>
            </a>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Management</div>
            <a href="/apps" class="sidebar-link" id="nav-apps">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5 12 3"></polyline><line x1="12" y1="12" x2="20" y2="7.5"></line><line x1="12" y1="12" x2="12" y2="21"></line><line x1="12" y1="12" x2="4" y2="7.5"></line></svg>
                Applications
            </a>
            <a href="/tunnels" class="sidebar-link" id="nav-tunnels">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 20h-10a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2z"></path><path d="M6 20v-13a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v13"></path><path d="M3 20h6"></path></svg>
                Cloudflare Tunnels
            </a>
            <div class="sidebar-section-label">Monitoring</div>
            <a href="https://monitor.andreslancheros.dev" class="sidebar-link" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M7 20h10"/><path d="M9 16v4"/><path d="M15 16v4"/></svg>
                Server Monitor
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar">A</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name">Admin</div>
                    <div class="sidebar-user-role">System Administrator</div>
                </div>
                <a href="/logout" class="sidebar-logout" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
            </div>
        </div>
    </aside>

    <div class="app-main">
        <%- body %>
    </div>

    <script src="/assets/js/main.js?v=5"></script>
    <script>
        // Highlight active nav
        (function() {
            var path = window.location.pathname;
            var navApps = document.getElementById('nav-apps');
            var navTunnels = document.getElementById('nav-tunnels');
            if (path.startsWith('/tunnels')) {
                navTunnels.classList.add('active');
            } else {
                navApps.classList.add('active');
            }
        })();
    </script>
</body>
</html>
