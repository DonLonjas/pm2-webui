<div class="app-topbar">
    <div class="d-flex gap-2 align-items-center">
        <button class="sidebar-toggle" onclick="document.getElementById('appSidebar').classList.toggle('open')">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1>Applications</h1>
    </div>
    <div class="topbar-actions">
        <a href="/tunnels" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;vertical-align:-3px;"><path d="M21 20h-10a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2z"></path><path d="M6 20v-13a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v13"></path></svg>
            Configurar Tunnels
        </a>
    </div>
</div>

<div class="app-content">
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:24px;">
        <% apps.forEach(function (app) { %>
            <div class="app-card <%= app.status === 'online' ? 'app-card-online' : 'app-card-offline' %>">
                <a href="/apps/<%= app.name %>" style="text-decoration:none; color:inherit; display:block;">
                    <div class="app-card-header">
                        <div class="app-card-name">
                            <div class="app-card-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="8" rx="3"/><rect x="3" y="12" width="18" height="8" rx="3"/><line x1="7" y1="8" x2="7" y2="8.01"/><line x1="7" y1="16" x2="7" y2="16.01"/></svg>
                            </div>
                            <%= app.name %>
                        </div>
                        <% if(app.status === "online"){ %>
                            <span class="badge bg-green-lt">● online</span>
                        <% } else { %>
                            <span class="badge bg-red-lt">● offline</span>
                        <% } %>
                    </div>
                    <div class="app-card-body">
                        <div class="app-stat">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--suave)"><rect x="3" y="4" width="18" height="8" rx="3"/><rect x="3" y="12" width="18" height="8" rx="3"/></svg>
                            <span class="app-stat-label">CPU</span>
                            <span class="app-stat-value highlight"><%= app.cpu %>%</span>
                        </div>
                        <div class="app-stat">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--suave)"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M7 20h10"/><path d="M9 16v4"/><path d="M15 16v4"/></svg>
                            <span class="app-stat-label">Memory</span>
                            <span class="app-stat-value"><%= app.memory %></span>
                        </div>
                        <div class="app-stat">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--suave)"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
                            <span class="app-stat-label">Uptime</span>
                            <span class="app-stat-value"><%= app.uptime %></span>
                        </div>
                    </div>
                </a>
                <div style="padding:0 20px 20px; display:flex; gap:8px;">
                    <% if(app.status === "online"){ %>
                        <button class="btn btn-sm btn-green" style="flex:1" onclick="pm2AppAction('<%= app.name %>', 'reload')">Reload</button>
                        <button class="btn btn-sm btn-warning" style="flex:1" onclick="pm2AppAction('<%= app.name %>', 'restart')">Restart</button>
                        <button class="btn btn-sm btn-danger" style="flex:1" onclick="pm2AppAction('<%= app.name %>', 'stop')">Stop</button>
                    <% } else { %>
                        <button class="btn btn-sm btn-warning" style="flex:1" onclick="pm2AppAction('<%= app.name %>', 'restart')">Start</button>
                    <% } %>
                </div>
            </div>
        <% }) %>
    </div>
</div>
